    #[test]
    fn detection_payload_roundtrip_keeps_line_scope_and_subframe_time() {
        use crate::detection::{DetectionCue, DetectionCueId, DetectionKind, MediaTick, TextAnchor};

        let payload = CommandPayload::AddDetection {
            line_id: 44,
            cue: DetectionCue {
                id: DetectionCueId(2),
                kind: DetectionKind::TeethVisible,
                media_tick: MediaTick(987),
                target: TextAnchor::GraphemeRange { start: 2, end: 4 },
            },
        };
        let json = serde_json::to_string(&payload).unwrap();
        let restored: CommandPayload = serde_json::from_str(&json).unwrap();
        match restored {
            CommandPayload::AddDetection { line_id, cue } => {
                assert_eq!(line_id, 44);
                assert_eq!(cue.media_tick, MediaTick(987));
                assert_eq!(cue.id, DetectionCueId(2));
            }
            _ => panic!("wrong variant"),
        }
    }
