name: Build track-scoped detection model

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/track-scoped-detection-model'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
          fetch-depth: 0

      - name: Implement detection domain and use cases
        shell: python
        run: |
          from pathlib import Path
          import re

          ROOT = Path('.')

          def write(path, content):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8', newline='\n')

          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          def replace_nth(path, old, new, occurrence):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              start = -1
              cursor = 0
              for _ in range(occurrence):
                  start = text.find(old, cursor)
                  if start < 0:
                      raise SystemExit(f'anchor occurrence {occurrence} not found in {path}: {old[:120]!r}')
                  cursor = start + len(old)
              text = text[:start] + new + text[start + len(old):]
              path.write_text(text, encoding='utf-8', newline='\n')

          def find_matching_brace(text, open_index):
              depth = 0
              i = open_index
              state = 'code'
              raw_hashes = 0
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'line_comment':
                      if ch == '\n':
                          state = 'code'
                      i += 1
                      continue
                  if state == 'block_comment':
                      if ch == '*' and nxt == '/':
                          state = 'code'
                          i += 2
                      else:
                          i += 1
                      continue
                  if state == 'string':
                      if ch == '\\':
                          i += 2
                      elif ch == '"':
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                      continue
                  if state == 'char':
                      if ch == '\\':
                          i += 2
                      elif ch == "'":
                          state = 'code'
                          i += 1
                      else:
                          i += 1
                      continue
                  if state == 'raw_string':
                      closing = '"' + ('#' * raw_hashes)
                      if text.startswith(closing, i):
                          state = 'code'
                          i += len(closing)
                      else:
                          i += 1
                      continue

                  if ch == '/' and nxt == '/':
                      state = 'line_comment'
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      state = 'block_comment'
                      i += 2
                      continue
                  if ch == 'r':
                      match = re.match(r'r(#+)?"', text[i:])
                      if match:
                          raw_hashes = len(match.group(1) or '')
                          state = 'raw_string'
                          i += len(match.group(0))
                          continue
                  if ch == '"':
                      state = 'string'
                      i += 1
                      continue
                  if ch == "'":
                      # Lifetimes are overwhelmingly followed by an identifier; only
                      # treat a quote as a char literal when another quote is nearby.
                      if text.find("'", i + 1, min(len(text), i + 8)) >= 0:
                          state = 'char'
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return i
                  i += 1
              raise SystemExit('unbalanced Rust braces while updating struct literals')

          def insert_field_in_struct_literals(path, type_name, field_name, field_expression):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              matches = list(re.finditer(rf'\b{re.escape(type_name)}\s*\{{', text))
              edits = []
              for match in matches:
                  prefix = text[max(0, match.start() - 48):match.start()]
                  if re.search(rf'\bstruct\s+{re.escape(type_name)}\s*$', prefix):
                      continue
                  open_index = text.find('{', match.start(), match.end())
                  close_index = find_matching_brace(text, open_index)
                  body = text[open_index + 1:close_index]
                  if re.search(rf'\b{re.escape(field_name)}\s*:', body):
                      continue
                  first_field = re.search(r'\n([ \t]+)\S', body)
                  if not first_field:
                      continue
                  indent = first_field.group(1)
                  insertion = f'{indent}{field_name}: {field_expression},\n'
                  line_start = text.rfind('\n', 0, close_index) + 1
                  edits.append((line_start, insertion))
              for index, insertion in reversed(edits):
                  text = text[:index] + insertion + text[index:]
              path.write_text(text, encoding='utf-8', newline='\n')

          detection_rs = r'''//! Semantic dialogue detection and text synchronization primitives.
//!
//! Detection cues are owned by a rythmo line. The line's track therefore scopes
//! selection and rendering, while each cue keeps an absolute media position so
//! moving the adaptation cannot move an event observed in the source image.

use serde::{Deserialize, Serialize};
use std::collections::HashSet;

pub const MEDIA_TICKS_PER_FRAME: i64 = 10;

#[derive(
    Clone, Copy, Debug, Default, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize,
)]
#[serde(transparent)]
pub struct MediaTick(pub i64);

impl MediaTick {
    pub const ZERO: Self = Self(0);

    pub const fn from_frame(frame: i64) -> Self {
        Self(frame.saturating_mul(MEDIA_TICKS_PER_FRAME))
    }

    pub fn from_frame_position(frame: f64) -> Self {
        if !frame.is_finite() {
            return Self::ZERO;
        }
        Self((frame * MEDIA_TICKS_PER_FRAME as f64).round() as i64)
    }

    pub const fn raw(self) -> i64 {
        self.0
    }

    pub fn as_frame_position(self) -> f64 {
        self.0 as f64 / MEDIA_TICKS_PER_FRAME as f64
    }

    pub fn scaled(self, ratio: f64) -> Self {
        if !ratio.is_finite() || ratio <= 0.0 {
            return self;
        }
        Self((self.0 as f64 * ratio).round() as i64)
    }
}

#[derive(
    Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize,
)]
#[serde(transparent)]
pub struct DetectionCueId(pub u64);

#[derive(
    Clone, Copy, Debug, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize, Deserialize,
)]
#[serde(transparent)]
pub struct SyncPointId(pub u64);

#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash, Serialize, Deserialize)]
#[serde(rename_all = "snake_case")]
pub enum DetectionKind {
    Labial,
    SemiLabial,
    MouthOpen,
    MouthClosed,
    TeethVisible,
    Breath,
    Reaction,
    SentenceStart,
    SentenceEnd,
    OverlapStart,
    OverlapEnd,
    SpeakerChange,
    OffScreen,
    VoiceOver,
    Telephone,
    Thought,
    Crowd,
}

#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
#[serde(tag = "kind", rename_all = "snake_case")]
pub enum TextAnchor {
    BeforeText,
    AfterText,
    Grapheme { index: u32 },
    GraphemeRange { start: u32, end: u32 },
}

impl TextAnchor {
    fn validate(&self) -> Result<(), String> {
        if let Self::GraphemeRange { start, end } = self {
            if start >= end {
                return Err(format!(
                    "invalid grapheme range {start}..{end}: the end must be greater than the start"
                ));
            }
        }
        Ok(())
    }
}

#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
pub struct DetectionCue {
    pub id: DetectionCueId,
    pub kind: DetectionKind,
    /// Absolute position in the source media, in tenths of a frame.
    pub media_tick: MediaTick,
    pub target: TextAnchor,
}

#[derive(Clone, Copy, Debug, PartialEq, Eq, Hash, Serialize, Deserialize)]
pub struct DetectionAddress {
    pub line_id: u64,
    pub detection_id: DetectionCueId,
}

#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]
pub struct TextSyncPoint {
    pub id: SyncPointId,
    /// Boundary before the referenced grapheme in the adapted text.
    pub grapheme_boundary: u32,
    /// Position relative to the beginning of the line, in tenths of a frame.
    pub line_tick: MediaTick,
}

#[derive(Clone, Debug, Default, PartialEq, Eq, Serialize, Deserialize)]
pub struct LineSemantics {
    #[serde(default, skip_serializing_if = "String::is_empty")]
    pub original_text: String,
    #[serde(default, skip_serializing_if = "Vec::is_empty")]
    pub detections: Vec<DetectionCue>,
    #[serde(default, skip_serializing_if = "Vec::is_empty")]
    pub sync_points: Vec<TextSyncPoint>,
}

impl LineSemantics {
    pub fn is_empty(&self) -> bool {
        self.original_text.is_empty() && self.detections.is_empty() && self.sync_points.is_empty()
    }

    pub fn next_detection_id(&self) -> Option<DetectionCueId> {
        let current = self
            .detections
            .iter()
            .map(|cue| cue.id.0)
            .max()
            .unwrap_or(0);
        current.checked_add(1).map(DetectionCueId)
    }

    pub fn detection(&self, id: DetectionCueId) -> Option<&DetectionCue> {
        self.detections.iter().find(|cue| cue.id == id)
    }

    pub fn insert_detection(&mut self, cue: DetectionCue) -> bool {
        if self.detection(cue.id).is_some() {
            return false;
        }
        self.detections.push(cue);
        self.sort_detections();
        true
    }

    pub fn remove_detection(&mut self, id: DetectionCueId) -> Option<DetectionCue> {
        let index = self.detections.iter().position(|cue| cue.id == id)?;
        Some(self.detections.remove(index))
    }

    pub fn move_detection(&mut self, id: DetectionCueId, media_tick: MediaTick) -> bool {
        let Some(cue) = self.detections.iter_mut().find(|cue| cue.id == id) else {
            return false;
        };
        if cue.media_tick == media_tick {
            return false;
        }
        cue.media_tick = media_tick;
        self.sort_detections();
        true
    }

    pub fn scaled_time(&self, ratio: f64) -> Self {
        let mut scaled = self.clone();
        for cue in &mut scaled.detections {
            cue.media_tick = cue.media_tick.scaled(ratio);
        }
        for point in &mut scaled.sync_points {
            point.line_tick = point.line_tick.scaled(ratio);
        }
        scaled
    }

    pub fn validate(&self) -> Result<(), String> {
        let mut detection_ids = HashSet::new();
        for cue in &self.detections {
            if !detection_ids.insert(cue.id) {
                return Err(format!("duplicate detection id {}", cue.id.0));
            }
            cue.target.validate()?;
        }

        let mut sync_ids = HashSet::new();
        for point in &self.sync_points {
            if !sync_ids.insert(point.id) {
                return Err(format!("duplicate sync point id {}", point.id.0));
            }
        }
        Ok(())
    }

    fn sort_detections(&mut self) {
        self.detections
            .sort_by_key(|cue| (cue.media_tick, cue.id));
    }
}

#[cfg(test)]
mod tests {
    use super::*;

    fn cue(id: u64, tick: i64) -> DetectionCue {
        DetectionCue {
            id: DetectionCueId(id),
            kind: DetectionKind::Labial,
            media_tick: MediaTick(tick),
            target: TextAnchor::Grapheme { index: 0 },
        }
    }

    #[test]
    fn media_ticks_round_to_tenths_of_a_frame() {
        assert_eq!(MediaTick::from_frame_position(12.34), MediaTick(123));
        assert_eq!(MediaTick::from_frame_position(12.36), MediaTick(124));
        assert_eq!(MediaTick(127).as_frame_position(), 12.7);
    }

    #[test]
    fn detections_are_kept_in_visual_order() {
        let mut semantics = LineSemantics::default();
        assert!(semantics.insert_detection(cue(2, 40)));
        assert!(semantics.insert_detection(cue(1, 20)));
        assert_eq!(semantics.detections[0].id, DetectionCueId(1));
        assert!(semantics.move_detection(DetectionCueId(2), MediaTick(10)));
        assert_eq!(semantics.detections[0].id, DetectionCueId(2));
    }

    #[test]
    fn time_scaling_preserves_text_anchors() {
        let mut semantics = LineSemantics::default();
        semantics.original_text = "Original".into();
        semantics.insert_detection(cue(1, 125));
        let scaled = semantics.scaled_time(2.0);
        assert_eq!(scaled.detections[0].media_tick, MediaTick(250));
        assert_eq!(scaled.detections[0].target, semantics.detections[0].target);
        assert_eq!(scaled.original_text, "Original");
    }
}
