    #[test]
    fn simultaneous_detections_stay_on_their_own_tracks() {
        use crate::detection::{DetectionKind, MediaTick, TextAnchor};

        let mut session = ProjectSession::new();
        let upper = session.project.add_line(0, 48, 0.0);
        let lower = session.project.add_line(0, 48, 0.5);
        let shared_tick = MediaTick(123);

        let (upper_id, _) = EditExecutor::add_detection(
            &mut session,
            upper,
            DetectionKind::Labial,
            shared_tick,
            TextAnchor::Grapheme { index: 1 },
        )
        .unwrap();
        let (lower_id, _) = EditExecutor::add_detection(
            &mut session,
            lower,
            DetectionKind::MouthOpen,
            shared_tick,
            TextAnchor::Grapheme { index: 0 },
        )
        .unwrap();

        assert_eq!(session.project.get_line(upper).unwrap().semantics.detections.len(), 1);
        assert_eq!(session.project.get_line(lower).unwrap().semantics.detections.len(), 1);
        assert_eq!(session.project.get_line(upper).unwrap().semantics.detections[0].id, upper_id);
        assert_eq!(session.project.get_line(lower).unwrap().semantics.detections[0].id, lower_id);

        session.project.get_line_mut(upper).unwrap().y_slot = 0.75;
        session.project.get_line_mut(upper).unwrap().start_frame = 100;
        let moved = session.project.get_line(upper).unwrap();
        assert_eq!(moved.semantics.detections[0].media_tick, shared_tick);
        assert!(!moved.detection_is_inside_line(upper_id).unwrap());
    }

    #[test]
    fn repeated_detection_moves_coalesce_into_one_undo_step() {
        use crate::detection::{DetectionKind, MediaTick, TextAnchor};

        let mut session = ProjectSession::new();
        let line_id = session.project.add_line(0, 48, 0.0);
        let (detection_id, _) = EditExecutor::add_detection(
            &mut session,
            line_id,
            DetectionKind::Labial,
            MediaTick(10),
            TextAnchor::Grapheme { index: 0 },
        )
        .unwrap();
        EditExecutor::move_detection(&mut session, line_id, detection_id, MediaTick(11)).unwrap();
        EditExecutor::move_detection(&mut session, line_id, detection_id, MediaTick(12)).unwrap();

        assert_eq!(
            session
                .project
                .get_line(line_id)
                .unwrap()
                .semantics
                .detection(detection_id)
                .unwrap()
                .media_tick,
            MediaTick(12)
        );
        assert!(EditExecutor::undo(&mut session));
        assert_eq!(
            session
                .project
                .get_line(line_id)
                .unwrap()
                .semantics
                .detection(detection_id)
                .unwrap()
                .media_tick,
            MediaTick(10)
        );
    }
