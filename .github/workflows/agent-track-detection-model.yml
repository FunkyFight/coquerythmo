#[cfg(test)]
mod semantic_tests {
    use super::*;
    use crate::detection::{DetectionCue, DetectionCueId, DetectionKind, MediaTick, TextAnchor};

    #[test]
    fn legacy_line_json_loads_without_semantics() {
        let json = r#"{
            "id": 1,
            "start_frame": 0,
            "duration_frames": 24,
            "y_slot": 0.0,
            "text": "Bonjour",
            "character_name": "Alice",
            "character_color": [1.0, 1.0, 1.0, 1.0]
        }"#;
        let line: RythmoLine = serde_json::from_str(json).unwrap();
        assert!(line.semantics.is_empty());
    }

    #[test]
    fn line_serialization_keeps_detection_with_the_line() {
        let mut line = RythmoLine {
            id: 1,
            start_frame: 0,
            duration_frames: 24,
            y_slot: 0.5,
            text: "Papa".into(),
            character_name: "Alice".into(),
            character_color: [1.0; 4],
            voice_actor_names: Vec::new(),
            syllable_ratios: Vec::new(),
            karaoke: false,
            note: String::new(),
            semantics: Default::default(),
        };
        line.semantics.insert_detection(DetectionCue {
            id: DetectionCueId(1),
            kind: DetectionKind::Labial,
            media_tick: MediaTick(75),
            target: TextAnchor::Grapheme { index: 0 },
        });
        let restored: RythmoLine =
            serde_json::from_str(&serde_json::to_string(&line).unwrap()).unwrap();
        assert_eq!(restored.semantics, line.semantics);
    }
}
