name: Source snapshot

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
      - name: Prepare repository file list
        run: |
          find . -path './target' -prune -o -path './.git' -prune -o -type f -print | sort > repo-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coquerythmo-file-list
          path: repo-files.txt
          retention-days: 1
