name: Source snapshot

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: source-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
          fetch-depth: 0
      - name: Commit repository file list
        run: |
          if test -f tools/repo-files.txt; then
            exit 0
          fi
          mkdir -p tools
          find . -path './target' -prune -o -path './.git' -prune -o -type f -print | sort > tools/repo-files.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/repo-files.txt
          git commit -m "Add temporary repository file list"
          git push origin HEAD:agent/track-scoped-detection-model
