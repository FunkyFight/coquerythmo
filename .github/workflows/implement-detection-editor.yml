name: Implement detection editor

on:
  push:
    branches:
      - agent/track-scoped-detection-model
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: detection-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
          fetch-depth: 0

      - name: Check whether implementation is already applied
        id: status
        shell: bash
        run: |
          if test -f src/state_detection.rs; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: Swatinem/rust-cache@v2
        if: steps.status.outputs.applied == 'false'

      - name: Apply integration patch
        if: steps.status.outputs.applied == 'false'
        run: |
          python tools/implement_detection_editor.py
          python tools/fix_detection_editor_compile.py
          python tools/fix_detection_editor_tests.py

      - name: Format Rust
        if: steps.status.outputs.applied == 'false'
        run: cargo fmt --all

      - name: Install Linux build dependencies
        if: steps.status.outputs.applied == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            fonts-noto-core \
            fonts-noto-cjk \
            fonts-noto-extra
          fc-cache -f

      - name: Run complete locked test suite
        id: cargo_test
        if: steps.status.outputs.applied == 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee cargo-test.log

      - name: Validate detection feature scope
        id: feature_tests
        if: steps.status.outputs.applied == 'false'
        shell: bash
        run: |
          cargo test --locked detection
          cargo test --locked pointer_hover_finds_line_through_render_index
          cargo test --locked project_metadata::tests

      - name: Check whitespace
        if: steps.status.outputs.applied == 'false'
        run: git diff --check

      - name: Commit tested implementation
        if: steps.status.outputs.applied == 'false' && steps.feature_tests.outcome == 'success'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Wire detection placement into editor [detection-ui]"
          git push origin HEAD:agent/track-scoped-detection-model
