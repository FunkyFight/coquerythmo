name: Normalize per-language syllabification source

on:
  push:
    branches:
      - agent/language-syllabification-final

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ !contains(github.event.head_commit.message, '[agent normalization]') && !contains(github.event.head_commit.message, '[agent cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize domain and catalogs
        shell: bash
        run: |
          set +e
          report=.agent-normalization-report.txt
          : > "$report"

          python3 - <<'PY' > /tmp/domain.log 2>&1
          from pathlib import Path
          path = Path('src/project.rs')
          text = path.read_text(encoding='utf-8')

          old_reset = '''        self.language_order.push(self.active_language.id);
        let mut settings = ProjectSettings::default();
        settings
            .export_configuration'''
          new_reset = '''        self.language_order.push(self.active_language.id);
        let mut settings = ProjectSettings {
            syllable_language: SyllableLanguage::from_code(&self.active_language.code),
            ..ProjectSettings::default()
        };
        settings
            .export_configuration'''
          if text.count(old_reset) != 1:
              raise SystemExit(f'expected one reset settings block, found {text.count(old_reset)}')
          text = text.replace(old_reset, new_reset, 1)

          anchor = '''    #[test]
    fn export_configuration_is_shared_across_language_switches() {
'''
          tests = '''    #[test]
    fn reset_keeps_the_active_languages_syllable_language() {
        let mut project = Project::new_with_language("English", "en");
        assert_eq!(project.syllable_language(), SyllableLanguage::English);

        project.reset();

        assert_eq!(project.syllable_language(), SyllableLanguage::English);
    }

    #[test]
    fn legacy_project_settings_default_to_french_syllabification() {
        let settings: ProjectSettings = serde_json::from_str("{}").unwrap();
        assert_eq!(settings.syllable_language, SyllableLanguage::French);
    }

'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one test anchor, found {text.count(anchor)}')
          text = text.replace(anchor, tests + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          domain_status=$?
          echo "DOMAIN_STATUS=$domain_status" >> "$report"
          if [ "$domain_status" -ne 0 ]; then
            cat /tmp/domain.log >> "$report"
          fi

          git fetch origin main --depth=1 > /tmp/fetch.log 2>&1
          fetch_status=$?
          echo "FETCH_STATUS=$fetch_status" >> "$report"
          if [ "$fetch_status" -ne 0 ]; then
            cat /tmp/fetch.log >> "$report"
          fi

          if [ "$fetch_status" -eq 0 ]; then
            git checkout origin/main -- i18n/en.toml
            python3 - <<'PY' > /tmp/english.log 2>&1
          from pathlib import Path
          path = Path('i18n/en.toml')
          data = path.read_bytes()
          old = b'"languages.clear_instrumental" = "Remove instrumental"\r\n'
          if data.count(old) != 1:
              old = b'"languages.clear_instrumental" = "Remove instrumental"\n'
          if data.count(old) != 1:
              raise SystemExit(f'expected one English language anchor, found {data.count(old)}')
          new = b'\n'.join([
              b'"languages.clear_instrumental" = "Remove instrumental"',
              b'"languages.syllables" = "Syllable language"',
              b'"languages.syllables.french" = "French"',
              b'"languages.syllables.english" = "English"',
              b'',
          ])
          path.write_bytes(data.replace(old, new, 1))
          PY
            english_status=$?
          else
            english_status=1
          fi
          echo "ENGLISH_STATUS=$english_status" >> "$report"
          if [ "$english_status" -ne 0 ] && [ -f /tmp/english.log ]; then
            cat /tmp/english.log >> "$report"
          fi

          cargo fmt --all > /tmp/fmt.log 2>&1
          fmt_status=$?
          echo "FMT_STATUS=$fmt_status" >> "$report"
          if [ "$fmt_status" -ne 0 ]; then
            tail -n 120 /tmp/fmt.log >> "$report"
          fi

          git diff --check > /tmp/diff.log 2>&1
          diff_status=$?
          echo "DIFF_STATUS=$diff_status" >> "$report"
          if [ "$diff_status" -ne 0 ]; then
            cat /tmp/diff.log >> "$report"
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent normalization] Normalize domain and catalogs'
          git push
