name: Run track detection implementation

on:
  push:
    branches:
      - agent/track-scoped-detection-model

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
          fetch-depth: 0

      - name: Execute implementation script
        shell: python
        run: |
          from pathlib import Path

          workflow = Path('.github/workflows/agent-track-detection-model.yml').read_text(encoding='utf-8')
          step = workflow.index('      - name: Implement detection domain and use cases')
          start = workflow.index('        run: |\n', step) + len('        run: |\n')
          end = workflow.index('\n      - name: Format and test', start)
          lines = workflow[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(script, '<track-detection-implementation>', 'exec'))

      - name: Format and test
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Add track-scoped detection domain [skip ci]"
          git push origin HEAD:agent/track-scoped-detection-model
