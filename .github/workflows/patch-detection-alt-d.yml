name: Patch detection shortcut to Alt+D

on:
  push:
    branches:
      - agent/track-scoped-detection-model
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write

concurrency:
  group: patch-detection-alt-d
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/track-scoped-detection-model
          fetch-depth: 0

      - name: Check shortcut state
        id: status
        shell: bash
        run: |
          if python - <<'PY'
          from pathlib import Path
          text = Path('src/app/event_loop.rs').read_text(encoding='utf-8')
          block = text[text.index('&& state.rythmo_detection_hovered()') - 400:text.index('&& state.rythmo_detection_hovered()') + 300]
          raise SystemExit(0 if '&& keyboard_modifiers.alt' in block else 1)
          PY
          then
            echo "patched=true" >> "$GITHUB_OUTPUT"
          else
            echo "patched=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Alt+D
        if: steps.status.outputs.patched == 'false'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app/event_loop.rs')
          text = path.read_text(encoding='utf-8')
          marker = '&& state.rythmo_detection_hovered()'
          marker_index = text.index(marker)
          start = max(0, marker_index - 500)
          block = text[start:marker_index + 300]
          old = '&& !keyboard_modifiers.alt'
          if old not in block:
              raise SystemExit('Could not find the plain-D detection shortcut guard')
          block = block.replace(old, '&& keyboard_modifiers.alt', 1)
          path.write_text(text[:start] + block + text[marker_index + 300:], encoding='utf-8')
          PY

      - name: Install Linux dependencies
        if: steps.status.outputs.patched == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Format and test
        if: steps.status.outputs.patched == 'false'
        run: |
          cargo fmt --all
          cargo test --locked input::router::tests::continuous_pan_starts_once_and_stops_on_key_up
          cargo test --locked detection
          git diff --check

      - name: Commit shortcut
        if: steps.status.outputs.patched == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/event_loop.rs
          git commit -m "Use Alt+D for detection palette"
          git push origin HEAD:agent/track-scoped-detection-model
