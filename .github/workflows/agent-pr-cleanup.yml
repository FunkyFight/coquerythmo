name: Clean language PR branch

on:
  push:
    branches:
      - agent/language-syllabification-pr

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[agent pr cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove temporary implementation files
        shell: bash
        run: |
          rm -f .agent-*
          rm -f scripts/agent_*.py
          rm -f .github/workflows/agent-language*.yml
          rm -f .github/workflows/agent-pr-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent pr cleanup] Add per-language syllabification'
          git push
