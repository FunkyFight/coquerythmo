name: Apply short karaoke fix

on:
  push:
    branches:
      - agent/fix-short-karaoke-lines

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[agent karaoke fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply and format
        run: |
          set -e
          python3 scripts/apply_short_karaoke_fix.py
          cargo fmt --all
          git diff --check
          rm -f .agent-short-karaoke-trigger
          rm -f scripts/apply_short_karaoke_fix.py
          rm -f .github/workflows/agent-fix-short-karaoke.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent karaoke fix] Preserve very short karaoke lines'
          git push
