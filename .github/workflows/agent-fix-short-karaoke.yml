name: Fix short karaoke lines

on:
  push:
    branches:
      - agent/fix-short-karaoke-lines

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[agent karaoke fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Apply shared karaoke row selection rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          scene_path = Path('src/rendering/rythmo/scene.rs')
          scene = scene_path.read_text(encoding='utf-8')
          scene = replace_once(
              scene,
              'use crate::rythmo_line::{MarkerKind, RythmoLine};\n',
              'use crate::rythmo_line::{MarkerKind, RythmoLine};\nuse std::collections::{HashMap, HashSet};\n',
              'scene collections import',
          )
          scene = replace_once(
              scene,
              '''#[derive(Clone, Debug, PartialEq)]
          pub struct SceneMarker {''',
              '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]
          pub struct KaraokeRowCandidate {
              pub id: u64,
              pub track_index: usize,
              pub stack_row: usize,
              pub start_frame: i64,
              pub active: bool,
          }

          /// Pick the single karaoke line that owns each visual row.
          ///
          /// An active line always beats a future preview. When several active
          /// lines overlap, the most recently started one wins. Before playback,
          /// the nearest upcoming line wins instead of a farther preview.
          pub fn karaoke_row_winners(
              candidates: impl IntoIterator<Item = KaraokeRowCandidate>,
          ) -> HashSet<u64> {
              let mut winners: HashMap<(usize, usize), KaraokeRowCandidate> = HashMap::new();
              for candidate in candidates {
                  let key = (candidate.track_index, candidate.stack_row);
                  winners
                      .entry(key)
                      .and_modify(|current| {
                          let candidate_wins = match (candidate.active, current.active) {
                              (true, false) => true,
                              (false, true) => false,
                              (true, true) => {
                                  (candidate.start_frame, candidate.id)
                                      > (current.start_frame, current.id)
                              }
                              (false, false) => {
                                  (candidate.start_frame, candidate.id)
                                      < (current.start_frame, current.id)
                              }
                          };
                          if candidate_wins {
                              *current = candidate;
                          }
                      })
                      .or_insert(candidate);
              }
              winners.into_values().map(|candidate| candidate.id).collect()
          }

          #[derive(Clone, Debug, PartialEq)]
          pub struct SceneMarker {''',
              'shared karaoke row selector',
          )
          scene = replace_once(
              scene,
              '''        let lines = line_ids
              .into_iter()''',
              '''        let mut lines: Vec<SceneLine> = line_ids
              .into_iter()''',
              'scene line vector type',
          )
          scene = replace_once(
              scene,
              '''            })
              .collect();

          let markers = render_index''',
              '''            })
              .collect();
          let karaoke_winners = karaoke_row_winners(lines.iter().filter_map(|scene_line| {
              scene_line
                  .karaoke_should_be_visible()
                  .then_some(KaraokeRowCandidate {
                      id: scene_line.line.id,
                      track_index: scene_line.track_index,
                      stack_row: scene_line.karaoke_stack_row,
                      start_frame: scene_line.line.start_frame,
                      active: scene_line.karaoke_active,
                  })
          }));
          lines.retain(|scene_line| {
              !scene_line.karaoke_should_be_visible()
                  || karaoke_winners.contains(&scene_line.line.id)
          });

          let markers = render_index''',
              'scene row filtering',
          )
          test_anchor = '''    #[test]
          fn karaoke_preview_states_are_centered() {'''
          tests = '''    #[test]
          fn active_short_karaoke_line_wins_over_a_farther_preview_on_the_same_row() {
              let mut project = Project::new();
              let first = project.add_line_full(0, 12, 0.5, "one".into(), "A".into(), [1.0; 4]);
              let second = project.add_line_full(12, 12, 0.5, "two".into(), "A".into(), [1.0; 4]);
              let third = project.add_line_full(24, 12, 0.5, "three".into(), "A".into(), [1.0; 4]);
              for id in [first, second, third] {
                  project.get_line_mut(id).unwrap().karaoke = true;
              }
              let mut index = ProjectRenderIndex::new();
              index.refresh(&project);

              let scene = RythmoScene::build(
                  &project,
                  &index,
                  SceneOptions {
                      frame_window: FrameWindow { first: -48, last: 72 },
                      current_frame: 6.0,
                      source_fps: 24.0,
                      ..SceneOptions::default()
                  },
              );
              let visible: HashSet<u64> = scene.lines.iter().map(|line| line.line.id).collect();

              assert!(visible.contains(&first));
              assert!(visible.contains(&second));
              assert!(!visible.contains(&third));
          }

          #[test]
          fn nearest_future_karaoke_preview_wins_when_no_line_is_active() {
              let winners = karaoke_row_winners([
                  KaraokeRowCandidate {
                      id: 1,
                      track_index: 0,
                      stack_row: 0,
                      start_frame: 12,
                      active: false,
                  },
                  KaraokeRowCandidate {
                      id: 2,
                      track_index: 0,
                      stack_row: 0,
                      start_frame: 36,
                      active: false,
                  },
              ]);

              assert_eq!(winners, HashSet::from([1]));
          }

          #[test]
          fn karaoke_preview_states_are_centered() {'''
          scene = replace_once(scene, test_anchor, tests, 'karaoke row tests')
          scene_path.write_text(scene, encoding='utf-8')

          view_path = Path('src/workspaces/rythmo/view.rs')
          view = view_path.read_text(encoding='utf-8')
          old = '''    let mut latest_karaoke_by_row: HashMap<(usize, usize), (i64, u64)> = HashMap::new();
          for (line_id, data) in &line_data {
              if !data.karaoke_playback {
                  continue;
              }
              let Some(line) = project.get_line(*line_id) else {
                  continue;
              };
              let key = (
                  rythmo_layout::track_index_for_y_slot(line.y_slot),
                  karaoke_index.stack_row(line),
              );
              let candidate = (line.start_frame, line.id);
              latest_karaoke_by_row
                  .entry(key)
                  .and_modify(|current| *current = (*current).max(candidate))
                  .or_insert(candidate);
          }
          line_data.retain(|(line_id, data)| {
              if !data.karaoke_playback {
                  return true;
              }
              let Some(line) = project.get_line(*line_id) else {
                  return false;
              };
              let key = (
                  rythmo_layout::track_index_for_y_slot(line.y_slot),
                  karaoke_index.stack_row(line),
              );
              latest_karaoke_by_row.get(&key).copied() == Some((line.start_frame, line.id))
          });'''
          new = '''    let karaoke_row_winners =
              crate::rendering::rythmo::scene::karaoke_row_winners(line_data.iter().filter_map(
                  |(line_id, data)| {
                      if !data.karaoke_playback {
                          return None;
                      }
                      let line = project.get_line(*line_id)?;
                      Some(crate::rendering::rythmo::scene::KaraokeRowCandidate {
                          id: line.id,
                          track_index: rythmo_layout::track_index_for_y_slot(line.y_slot),
                          stack_row: karaoke_index.stack_row(line),
                          start_frame: line.start_frame,
                          active: line.karaoke_active(current_frame),
                      })
                  },
              ));
          line_data.retain(|(line_id, data)| {
              !data.karaoke_playback || karaoke_row_winners.contains(line_id)
          });'''
          view = replace_once(view, old, new, 'interactive karaoke row filtering')
          view_path.write_text(view, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set +e
          report=.agent-short-karaoke-validation.txt
          : > "$report"
          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            "$@" >"$log" 2>&1
            status=$?
            echo "${name}_STATUS=$status" >> "$report"
            if [ "$status" -ne 0 ]; then
              echo "--- ${name} failure ---" >> "$report"
              tail -n 180 "$log" >> "$report"
            fi
            return 0
          }
          run_check FMT cargo fmt --all
          run_check CHECK cargo check --lib
          run_check ROW_TEST cargo test --lib karaoke_row -- --nocapture
          run_check SHORT_TEST cargo test --lib active_short_karaoke -- --nocapture
          run_check LIB_TEST cargo test --lib
          run_check DIFF_CHECK git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent karaoke fix] Preserve very short karaoke lines'
          git push
