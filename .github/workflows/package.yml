name: Package Coquerythmo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ex: 1.1.0"
        required: true
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary: coquerythmo.exe

          - os: ubuntu-latest
            platform: linux
            binary: coquerythmo

          - os: macos-15
            platform: macos
            binary: coquerythmo

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Version requise."
          }

          ./set_version.ps1 $version

      - name: Install Linux build dependencies for wgpu/winit
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libgl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install bundled FFmpeg packages
        shell: bash
        run: |
          npm init -y
          npm install ffmpeg-static ffprobe-static

      - name: Build coquerythmo
        run: cargo build --release

      - name: Build updater on Windows only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd updater
          cargo build --release
          cd ..

      - name: Prepare dist folder
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/

      - name: Copy updater on Windows only
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Force "updater\target\release\updater.exe" "dist\updater.exe"

      - name: Copy FFmpeg and FFprobe next to app
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ffmpeg = require("ffmpeg-static");
          const ffprobe = require("ffprobe-static").path;

          if (!ffmpeg) {
            throw new Error("ffmpeg-static did not return a binary path");
          }

          if (!ffprobe) {
            throw new Error("ffprobe-static did not return a binary path");
          }

          const dist = path.resolve("dist");
          fs.mkdirSync(dist, { recursive: true });

          const exe = process.platform === "win32" ? ".exe" : "";

          const ffmpegDest = path.join(dist, `ffmpeg${exe}`);
          const ffprobeDest = path.join(dist, `ffprobe${exe}`);

          fs.copyFileSync(ffmpeg, ffmpegDest);
          fs.copyFileSync(ffprobe, ffprobeDest);

          if (process.platform !== "win32") {
            fs.chmodSync(ffmpegDest, 0o755);
            fs.chmodSync(ffprobeDest, 0o755);
          }

          console.log("Copied:");
          console.log(ffmpegDest);
          console.log(ffprobeDest);
          NODE

      - name: Test bundled FFmpeg
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/ffmpeg.exe -version
            ./dist/ffprobe.exe -version
          else
            ./dist/ffmpeg -version
            ./dist/ffprobe -version
          fi

      - name: Create Windows portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zip = "coquerythmo-v$version-windows-portable.zip"

          Compress-Archive `
            -Force `
            -CompressionLevel Fastest `
            -Path "dist\*" `
            -DestinationPath $zip

      - name: Create Linux/macOS portable archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          PLATFORM="${{ matrix.platform }}"
          ARCHIVE="coquerythmo-v${VERSION}-${PLATFORM}-portable.tar.gz"

          tar -czf "$ARCHIVE" -C dist .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: coquerythmo-v${{ inputs.version }}-${{ matrix.platform }}-portable
          path: |
            coquerythmo-v${{ inputs.version }}-${{ matrix.platform }}-portable.zip
            coquerythmo-v${{ inputs.version }}-${{ matrix.platform }}-portable.tar.gz
