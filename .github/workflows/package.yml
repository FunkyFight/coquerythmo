name: Package Coquerythmo

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ex: 3.0.2"
        required: true
        type: string

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            exe_suffix: ".exe"

          - os: ubuntu-latest
            platform: linux
            exe_suffix: ""

          - os: macos-latest
            platform: macos
            exe_suffix: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set version
        shell: pwsh
        run: |
          ./set_version.ps1 "${{ inputs.version }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            pkg-config \
            zip \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libgl1-mesa-dev \
            mesa-vulkan-drivers

      - name: Install FFmpeg static packages
        shell: bash
        run: |
          npm init -y
          npm install ffmpeg-static ffprobe-static

      - name: Build coquerythmo
        run: cargo build --release

      - name: Build updater
        run: cargo build --release --manifest-path updater/Cargo.toml

      - name: Prepare dist
        shell: bash
        run: |
          mkdir -p dist

          cp "target/release/coquerythmo${{ matrix.exe_suffix }}" "dist/"
          cp "updater/target/release/updater${{ matrix.exe_suffix }}" "dist/"

      - name: Copy FFmpeg and FFprobe
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const ffmpeg = require("ffmpeg-static");
          const ffprobe = require("ffprobe-static").path;

          if (!ffmpeg) throw new Error("ffmpeg-static did not return a binary path");
          if (!ffprobe) throw new Error("ffprobe-static did not return a binary path");

          const dist = path.resolve("dist");
          const exe = process.platform === "win32" ? ".exe" : "";

          const ffmpegDest = path.join(dist, `ffmpeg${exe}`);
          const ffprobeDest = path.join(dist, `ffprobe${exe}`);

          fs.copyFileSync(ffmpeg, ffmpegDest);
          fs.copyFileSync(ffprobe, ffprobeDest);

          if (process.platform !== "win32") {
            fs.chmodSync(ffmpegDest, 0o755);
            fs.chmodSync(ffprobeDest, 0o755);
          }

          console.log("FFmpeg:", ffmpegDest);
          console.log("FFprobe:", ffprobeDest);
          NODE

      - name: Make Unix binaries executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/coquerythmo
          chmod +x dist/updater
          chmod +x dist/ffmpeg
          chmod +x dist/ffprobe

      - name: Detect Rust target arch
        shell: bash
        run: |
          HOST="$(rustc -vV | awk '/host:/ { print $2 }')"

          case "$HOST" in
            x86_64-*) ARCH="x86_64" ;;
            aarch64-*) ARCH="aarch64" ;;
            i686-*|i586-*|i486-*) ARCH="x86" ;;
            *) ARCH="$(uname -m)" ;;
          esac

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=coquerythmo-v${{ inputs.version }}-${{ matrix.platform }}-$ARCH-portable.zip" >> "$GITHUB_ENV"
          echo "APP_PACKAGE_NAME=coquerythmo-v${{ inputs.version }}-${{ matrix.platform }}-$ARCH-app.zip" >> "$GITHUB_ENV"

      - name: Test bundled FFmpeg
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./dist/ffmpeg.exe -version
            ./dist/ffprobe.exe -version
          else
            ./dist/ffmpeg -version
            ./dist/ffprobe -version
          fi

      - name: Create macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist-app/Coquerythmo.app"
          MACOS_DIR="$APP/Contents/MacOS"
          RESOURCES_BIN_DIR="$APP/Contents/Resources/bin"

          mkdir -p "$MACOS_DIR" "$RESOURCES_BIN_DIR"

          cp dist/coquerythmo "$MACOS_DIR/coquerythmo"
          cp dist/updater "$MACOS_DIR/updater"
          cp dist/ffmpeg dist/ffprobe "$RESOURCES_BIN_DIR/"

          chmod +x \
            "$MACOS_DIR/coquerythmo" \
            "$MACOS_DIR/updater" \
            "$RESOURCES_BIN_DIR/ffmpeg" \
            "$RESOURCES_BIN_DIR/ffprobe"

          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>coquerythmo</string>
            <key>CFBundleIdentifier</key>
            <string>com.coquerythmo.Coquerythmo</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>Coquerythmo</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ inputs.version }}</string>
            <key>CFBundleVersion</key>
            <string>${{ inputs.version }}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

          "$RESOURCES_BIN_DIR/ffmpeg" -version
          "$RESOURCES_BIN_DIR/ffprobe" -version

          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Create macOS app zip
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist-app/Coquerythmo.app" "$APP_PACKAGE_NAME"

      - name: Create Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Force `
            -CompressionLevel Fastest `
            -Path "dist\*" `
            -DestinationPath "$env:PACKAGE_NAME"

      - name: Create Linux/macOS zip
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          zip -r "../$PACKAGE_NAME" .

      - name: Upload to Gofile
        shell: bash
        run: |
          echo "### 🚀 Liens Gofile (${{ matrix.platform }})" >> $GITHUB_STEP_SUMMARY
          
          # Upload du fichier portable principal
          echo "Uploading $PACKAGE_NAME to Gofile..."
          RES1=$(curl -s -F "file=@${PACKAGE_NAME}" https://upload.gofile.io/uploadfile)
          
          # Extraction des données avec jq
          DOWNLOAD_LINK=$(echo $RES1 | jq -r '.data.downloadPage')
          TOKEN=$(echo $RES1 | jq -r '.data.guestToken')
          FOLDER_ID=$(echo $RES1 | jq -r '.data.parentFolder')
          
          echo "- 📦 **Portable** : [Télécharger $PACKAGE_NAME]($DOWNLOAD_LINK)" >> $GITHUB_STEP_SUMMARY
          
          # Si on est sur macOS, on upload aussi le dossier .app dans le MÊME dossier Gofile
          if [ "${{ runner.os }}" = "macOS" ]; then
            echo "Uploading $APP_PACKAGE_NAME to the same Gofile folder..."
            RES2=$(curl -s -F "file=@${APP_PACKAGE_NAME}" -F "token=$TOKEN" -F "folderId=$FOLDER_ID" https://upload.gofile.io/uploadfile)
            APP_DOWNLOAD_LINK=$(echo $RES2 | jq -r '.data.downloadPage')
            
            echo "- 🍏 **App Bundle** : [Télécharger $APP_PACKAGE_NAME]($APP_DOWNLOAD_LINK)" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Le lien principal est le même que celui du premier fichier uploadé
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📂 **[Accéder au dossier Gofile]($DOWNLOAD_LINK)**" >> $GITHUB_STEP_SUMMARY
