name: Fix PR4 GPU export language

on:
  push:
    branches:
      - agent/language-syllabification-pr
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/language-syllabification-pr' || github.ref_name == 'agent/language-syllabification-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/language-syllabification-pr
          fetch-depth: 0

      - name: Apply focused renderer fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/rythmo_gpu_renderer.rs")
          text = path.read_text(encoding="utf-8")
          old = "scene.syllable_language.code()"
          new = "scene.project.syllable_language_code()"
          count = text.count(old)
          if count != 4:
              raise SystemExit(f"Expected exactly 4 GPU export occurrences, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

      - name: Validate patch
        run: |
          cargo fmt --all -- --check
          git diff --check

      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/fix-pr4-gpu-export-language.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rythmo_gpu_renderer.rs .github/workflows/fix-pr4-gpu-export-language.yml
          git commit -m "Fix GPU export syllabification language"
          git push origin HEAD:agent/language-syllabification-pr
