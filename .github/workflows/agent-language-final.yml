name: Final per-language syllabification validation

on:
  push:
    branches:
      - agent/language-syllabification-v2

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[agent final validation]') && !contains(github.event.head_commit.message, '[agent cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libudev-dev

      - name: Normalize source and run validation
        shell: bash
        run: |
          set +e
          report=.agent-language-final-validation.txt
          : > "$report"

          run_check() {
            name="$1"
            shift
            log="/tmp/${name}.log"
            "$@" >"$log" 2>&1
            status=$?
            echo "${name}_STATUS=$status" >> "$report"
            if [ "$status" -ne 0 ]; then
              echo "--- ${name} failure ---" >> "$report"
              tail -n 160 "$log" >> "$report"
            fi
            return 0
          }

          run_check LITERAL_FIX python3 scripts/agent_fix_language_test_literals.py
          run_check FMT cargo fmt --all
          run_check CHECK cargo check --lib
          run_check DOMAIN_TEST cargo test --lib syllable_language -- --nocapture
          run_check MODAL_TEST cargo test --lib language_modal -- --nocapture
          run_check LIB_TEST cargo test --lib
          run_check DIFF_CHECK git diff --check

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent final validation] Validate per-language syllabification'
          git push
