name: Apply requested fixes

on:
  push:
    branches:
      - agent/fix-karaoke-dev-recording
    paths:
      - tools/validation-trigger.txt

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-karaoke-dev-recording
          fetch-depth: 0

      - name: Apply source changes
        run: python3 tools/apply_agent_fixes.py

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Remove temporary helper files
        run: rm -f tools/apply_agent_fixes.py tools/validation-trigger.txt tools/test-output.log .github/workflows/apply-agent-fixes.yml

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix karaoke timing and gate recording workspace"
          git push origin HEAD:agent/fix-karaoke-dev-recording
