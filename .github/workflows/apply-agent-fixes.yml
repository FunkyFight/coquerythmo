name: Apply and validate requested fixes

on:
  push:
    branches:
      - agent/fix-karaoke-dev-recording
    paths:
      - tools/validation-trigger.txt

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-karaoke-dev-recording
          fetch-depth: 0

      - name: Apply source changes
        run: python3 tools/apply_agent_fixes.py

      - name: Install Rust formatter
        run: rustup component add rustfmt

      - name: Format
        run: cargo fmt --all

      - name: Check diff
        run: git diff --check

      - name: Run tests
        run: |
          set +e
          RUSTFLAGS="-Awarnings" cargo test --all-targets --quiet > tools/test-output.log 2>&1
          status=$?
          cat tools/test-output.log
          exit $status

      - name: Commit validation failure log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/test-output.log
          git commit -m "Capture validation failure"
          git push origin HEAD:agent/fix-karaoke-dev-recording

      - name: Commit validated changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/dispatcher.rs src/ui/layout.rs src/ui/shell.rs src/workspaces/rythmo/view.rs
          git commit -m "Fix karaoke timing and gate recording workspace"
          git push origin HEAD:agent/fix-karaoke-dev-recording
