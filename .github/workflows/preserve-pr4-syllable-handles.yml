name: Preserve PR4 syllable handles

on:
  push:
    branches:
      - agent/language-syllabification-pr
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  preserve:
    if: github.head_ref == 'agent/language-syllabification-pr' || github.ref_name == 'agent/language-syllabification-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/language-syllabification-pr
          fetch-depth: 0

      - name: Preserve manual syllable timings
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/project.rs")
          text = path.read_text(encoding="utf-8")

          old_create = '''        let mut band = self.current_band_snapshot();
                  let syllable_language = SyllableLanguage::from_code(&language.code);
                  if band.settings.syllable_language != syllable_language {
                      band.settings.syllable_language = syllable_language;
                      Self::clear_band_syllable_ratios(&mut band.line_map);
                  }
          '''
          new_create = '''        let mut band = self.current_band_snapshot();
                  band.settings.syllable_language = SyllableLanguage::from_code(&language.code);
          '''
          if old_create not in text:
              raise SystemExit("create_language destructive block not found")
          text = text.replace(old_create, new_create, 1)

          active_clear = '''            self.settings.syllable_language = language;
                      Self::clear_band_syllable_ratios(&mut self.line_map);
                      self.bump_revision();
          '''
          active_keep = '''            self.settings.syllable_language = language;
                      self.bump_revision();
          '''
          if active_clear not in text:
              raise SystemExit("active language destructive block not found")
          text = text.replace(active_clear, active_keep, 1)

          inactive_clear = '''        snapshot.band.settings.syllable_language = language;
                  Self::clear_band_syllable_ratios(&mut snapshot.band.line_map);
                  snapshot.band.revision = snapshot.band.revision.wrapping_add(1);
          '''
          inactive_keep = '''        snapshot.band.settings.syllable_language = language;
                  snapshot.band.revision = snapshot.band.revision.wrapping_add(1);
          '''
          if inactive_clear not in text:
              raise SystemExit("inactive language destructive block not found")
          text = text.replace(inactive_clear, inactive_keep, 1)

          helper = '''
              fn clear_band_syllable_ratios(lines: &mut HashMap<u64, RythmoLine>) {
                  for line in lines.values_mut() {
                      line.syllable_ratios.clear();
                  }
              }
          '''
          if helper not in text:
              raise SystemExit("destructive helper not found")
          text = text.replace(helper, "\n", 1)

          start = text.index("    #[test]\n    fn syllable_language_is_scoped_to_each_language_band()")
          end = text.index("    #[test]\n    fn export_configuration_is_shared_across_language_switches()", start)
          replacement = '''    #[test]
              fn creating_language_preserves_manual_syllable_timings() {
                  let mut project = Project::new_with_language("Français", "fr-fr");
                  let french_id = project.active_language_id();
                  let line_id = project.add_line_full(0, 48, 0.5, "tambourine".into(), "A".into(), [1.0; 4]);
                  project.get_line_mut(line_id).unwrap().syllable_ratios = vec![0.25, 0.75];

                  let english_id = project.create_language("English", "en");
                  assert_eq!(project.syllable_language(), SyllableLanguage::English);
                  assert_eq!(
                      project.get_line(line_id).unwrap().syllable_ratios,
                      vec![0.25, 0.75]
                  );

                  assert!(project.select_language(french_id));
                  assert_eq!(project.syllable_language(), SyllableLanguage::French);
                  assert_eq!(
                      project.get_line(line_id).unwrap().syllable_ratios,
                      vec![0.25, 0.75]
                  );
                  assert_eq!(
                      project.language_syllable_language(english_id),
                      Some(SyllableLanguage::English)
                  );
              }

              #[test]
              fn changing_syllable_language_preserves_manual_timings_in_every_band() {
                  let mut project = Project::new_with_language("Français", "fr-fr");
                  let french_id = project.active_language_id();
                  let line_id = project.add_line_full(0, 48, 0.5, "Bonjour".into(), "A".into(), [1.0; 4]);
                  project.get_line_mut(line_id).unwrap().syllable_ratios = vec![0.4, 0.6];

                  let english_id = project.create_language("English", "en");
                  project.get_line_mut(line_id).unwrap().syllable_ratios = vec![0.2, 0.3, 0.5];
                  assert!(project.set_language_syllable_language(english_id, SyllableLanguage::French));
                  assert_eq!(
                      project.get_line(line_id).unwrap().syllable_ratios,
                      vec![0.2, 0.3, 0.5]
                  );

                  assert!(project.select_language(french_id));
                  assert_eq!(
                      project.get_line(line_id).unwrap().syllable_ratios,
                      vec![0.4, 0.6]
                  );
                  assert!(project.set_language_syllable_language(french_id, SyllableLanguage::English));
                  assert_eq!(
                      project.get_line(line_id).unwrap().syllable_ratios,
                      vec![0.4, 0.6]
                  );
              }

          '''
          text = text[:start] + replacement + text[end:]

          if "clear_band_syllable_ratios" in text:
              raise SystemExit("destructive ratio clearing remains")
          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Validate focused change
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit preservation fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/project.rs
          git commit -m "Preserve manual syllable timings when language changes [skip ci]"
          git push origin HEAD:agent/language-syllabification-pr
