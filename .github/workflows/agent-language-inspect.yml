name: Agent language inspection

on:
  push:
    branches:
      - agent/language-syllabification

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Capture source trace
        if: ${{ !contains(github.event.head_commit.message, '[agent inspection]') }}
        run: |
          {
            printf '%s\n' '--- working tree ---'
            git status --short
            printf '%s\n' '--- configuration language callers ---'
            rg -n -C 5 'config::get\(\)\.lang|config::get\(\)\.lang\.clone' src tests || true
            printf '%s\n' '--- syllable API callers ---'
            rg -n -C 4 'syllable_breaks|syllable_count|timing_ratios|visual_progress_from_timing|read_highlight_end_from_timing|split_dialogue_at_syllable|visible_syllable_segments|syllable_ratios_for_line' src tests || true
            printf '%s\n' '--- language modal and state callers ---'
            rg -n -C 5 'LanguageListItem|LanguageModalResult|open_languages_modal|refresh_languages_modal|create_language|rename_language|select_language|ProjectLanguage' src tests || true
          } > .agent-language-inspection.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .agent-language-inspection.txt
          git commit -m '[agent inspection] Capture language flow'
          git push
