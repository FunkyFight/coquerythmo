name: Agent language implementation

on:
  push:
    branches:
      - agent/language-syllabification

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[agent implementation]') && !contains(github.event.head_commit.message, '[agent validation]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply source changes and validate
        shell: bash
        run: |
          set +e
          : > .agent-language-validation.txt
          python3 scripts/repair_agent_language_patch.py >> .agent-language-validation.txt 2>&1
          repair_status=$?
          echo "REPAIR_STATUS=$repair_status" >> .agent-language-validation.txt
          if [ "$repair_status" -eq 0 ]; then
            python3 scripts/agent_language_patch.py >> .agent-language-validation.txt 2>&1
            patch_status=$?
          else
            patch_status=1
          fi
          echo "PATCH_STATUS=$patch_status" >> .agent-language-validation.txt
          if [ "$patch_status" -eq 0 ]; then
            cargo fmt --all >> .agent-language-validation.txt 2>&1
            fmt_status=$?
            echo "FMT_STATUS=$fmt_status" >> .agent-language-validation.txt
            cargo test --lib syllable_language -- --nocapture >> .agent-language-validation.txt 2>&1
            focused_status=$?
            echo "FOCUSED_TEST_STATUS=$focused_status" >> .agent-language-validation.txt
            cargo test --lib >> .agent-language-validation.txt 2>&1
            test_status=$?
            echo "LIB_TEST_STATUS=$test_status" >> .agent-language-validation.txt
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m '[agent implementation] Add per-language syllabification'
          git push
