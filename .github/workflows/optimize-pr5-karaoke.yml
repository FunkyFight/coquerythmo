name: Optimize PR5 karaoke arbitration

on:
  push:
    branches:
      - agent/fix-short-karaoke-lines
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  optimize:
    if: github.head_ref == 'agent/fix-short-karaoke-lines' || github.ref_name == 'agent/fix-short-karaoke-lines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-short-karaoke-lines
          fetch-depth: 0

      - name: Rework hot-path arbitration
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          scene = subprocess.check_output(
              ["git", "show", "origin/main:src/rendering/rythmo/scene.rs"],
              text=True,
          )
          Path("src/rendering/rythmo/scene.rs").write_text(scene, encoding="utf-8", newline="\n")

          path = Path("src/workspaces/rythmo/view.rs")
          text = path.read_text(encoding="utf-8")

          helper_anchor = '''fn character_badge_collision_style(
              line_id: u64,
              character_name: &str,
              badge_rect: &Rect,
              other_lines: &[(u64, Rect, &str)],
          ) -> (bool, f32) {
              let mut alpha = 1.0;
              for (other_id, other_rect, other_character_name) in other_lines {
                  if *other_id == line_id || !rects_overlap(badge_rect, other_rect) {
                      continue;
                  }
                  if *other_character_name == character_name {
                      return (true, 1.0);
                  }
                  alpha = constants::CHARACTER_BADGE_COLLISION_OPACITY;
              }
              (false, alpha)
          }
          '''
          helper = helper_anchor + '''
          fn karaoke_row_candidate_wins(
              candidate: (bool, i64, u64),
              current: (bool, i64, u64),
          ) -> bool {
              match (candidate.0, current.0) {
                  (true, false) => true,
                  (false, true) => false,
                  (true, true) => (candidate.1, candidate.2) > (current.1, current.2),
                  (false, false) => (candidate.1, candidate.2) < (current.1, current.2),
              }
          }
          '''
          if helper_anchor not in text:
              raise SystemExit("character badge helper anchor not found")
          text = text.replace(helper_anchor, helper, 1)

          old_fields = '''        karaoke_playback: bool,
                  karaoke_count_in: bool,
                  karaoke_progress_info: Option<KaraokeProgressRenderInfo>,
          '''
          new_fields = '''        karaoke_playback: bool,
                  karaoke_count_in: bool,
                  karaoke_progress_info: Option<KaraokeProgressRenderInfo>,
                  karaoke_row_key: Option<(usize, usize)>,
                  karaoke_priority: (bool, i64, u64),
          '''
          if old_fields not in text:
              raise SystemExit("LineRenderData fields anchor not found")
          text = text.replace(old_fields, new_fields, 1)

          width_anchor = '''        let centered_karaoke_width =
                      if karaoke_playback && (karaoke_active || karaoke_count_in || karaoke_upcoming_stack) {
                          Some(state.karaoke_ui_text_width_for_render(line))
                      } else {
                          None
                      };
          '''
          width_replacement = '''        let karaoke_stack_row = if karaoke_playback {
                      karaoke_index.stack_row(line)
                  } else {
                      0
                  };
                  let centered_karaoke_width =
                      if karaoke_playback && (karaoke_active || karaoke_count_in || karaoke_upcoming_stack) {
                          Some(state.karaoke_ui_text_width_for_render(line))
                      } else {
                          None
                      };
          '''
          if width_anchor not in text:
              raise SystemExit("centered karaoke width anchor not found")
          text = text.replace(width_anchor, width_replacement, 1)

          stack_call = "                karaoke_index.stack_row(line),\n"
          if text.count(stack_call) < 1:
              raise SystemExit("karaoke stack-row call not found")
          text = text.replace(stack_call, "                karaoke_stack_row,\n", 1)

          old_init = '''                karaoke_playback,
                          karaoke_count_in,
                          karaoke_progress_info,
                      },
          '''
          new_init = '''                karaoke_playback,
                          karaoke_count_in,
                          karaoke_progress_info,
                          karaoke_row_key: karaoke_playback.then_some((
                              rythmo_layout::track_index_for_y_slot(line.y_slot),
                              karaoke_stack_row,
                          )),
                          karaoke_priority: (karaoke_active, line.start_frame, line.id),
                      },
          '''
          if old_init not in text:
              raise SystemExit("LineRenderData initializer anchor not found")
          text = text.replace(old_init, new_init, 1)

          old_block = '''    let karaoke_row_winners = crate::rendering::rythmo::scene::karaoke_row_winners(
                  line_data.iter().filter_map(|(line_id, data)| {
                      if !data.karaoke_playback {
                          return None;
                      }
                      let line = project.get_line(*line_id)?;
                      Some(crate::rendering::rythmo::scene::KaraokeRowCandidate {
                          id: line.id,
                          track_index: rythmo_layout::track_index_for_y_slot(line.y_slot),
                          stack_row: karaoke_index.stack_row(line),
                          start_frame: line.start_frame,
                          active: line.karaoke_active(current_frame),
                      })
                  }),
              );
              line_data
                  .retain(|(line_id, data)| !data.karaoke_playback || karaoke_row_winners.contains(line_id));
          '''
          new_block = '''    let mut karaoke_winner_by_row: HashMap<(usize, usize), (bool, i64, u64)> =
                  HashMap::new();
              for (_, data) in &line_data {
                  let Some(key) = data.karaoke_row_key else {
                      continue;
                  };
                  let candidate = data.karaoke_priority;
                  karaoke_winner_by_row
                      .entry(key)
                      .and_modify(|current| {
                          if karaoke_row_candidate_wins(candidate, *current) {
                              *current = candidate;
                          }
                      })
                      .or_insert(candidate);
              }
              line_data.retain(|(_, data)| {
                  let Some(key) = data.karaoke_row_key else {
                      return true;
                  };
                  karaoke_winner_by_row.get(&key).copied() == Some(data.karaoke_priority)
              });
          '''
          if old_block not in text:
              raise SystemExit("PR5 arbitration block not found")
          text = text.replace(old_block, new_block, 1)

          tests_anchor = '''mod tests {
              use super::*;
          '''
          tests_replacement = tests_anchor + '''
              #[test]
              fn active_karaoke_candidate_beats_future_preview() {
                  assert!(karaoke_row_candidate_wins((true, 0, 1), (false, 24, 2)));
                  assert!(!karaoke_row_candidate_wins((false, 24, 2), (true, 0, 1)));
              }

              #[test]
              fn nearest_future_karaoke_candidate_wins() {
                  assert!(karaoke_row_candidate_wins((false, 12, 1), (false, 24, 2)));
                  assert!(!karaoke_row_candidate_wins((false, 24, 2), (false, 12, 1)));
              }
          '''
          if tests_anchor not in text:
              raise SystemExit("tests module anchor not found")
          text = text.replace(tests_anchor, tests_replacement, 1)

          path.write_text(text, encoding="utf-8", newline="\n")

      - name: Validate focused change
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit optimized implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/rendering/rythmo/scene.rs src/workspaces/rythmo/view.rs
          git commit -m "Optimize short karaoke line arbitration [skip ci]"
          git push origin HEAD:agent/fix-short-karaoke-lines
