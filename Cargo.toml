[package]
name = "coquerythmo"
version = "3.6.0"
edition = "2021"

[dependencies]
winit = "0.29"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
wgpu = "29.0.1"
glyphon = { git = "https://github.com/RuairidhWilliamson/glyphon", rev = "45a4a34" }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
resvg = "0.44"
rfd = "0.15"
cpal = "0.15"
rust_socketio = "0.6"
rand = "0.8"
base64 = "0.22"
hypher = "0.1"
ureq = { version = "3", features = ["json"] }
open = "5"
quick-xml = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "gif"] }

[target.'cfg(windows)'.dependencies]
accesskit = "0.12.3"
accesskit_winit = { version = "0.18.7", default-features = false, features = ["rwh_06"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
